<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    {% load static %}
    <link rel="stylesheet" type="text/css" href="{% static 'css/estilos.css' %}">

    <title>
      {% block title %}
      {% endblock %}
    </title>
  </head>
  <body>
  <header>
    <img src="{% static 'images/logo.png' %}" height="10%" width="10%" alt="My image">
    <h1>Administración de Edificios y Departamentos</h1>

    <div class="">
        {% if messages %}
          <div class="messages">
            {% for message in messages %}
            <span{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</span>
            {% endfor %}
          </div>
        {% endif %}
      </div>
    <nav class="top_menu">
      <ul>
        <li><a href="{% url 'index' %}">inicio</a></li>
      </ul>
    </nav>
  </header>
  <section>
      {% block content %}
      {% endblock %}
  </section>

    <footer>
      <p>Loja-Ecuador</p>
      <p>{% now "j F Y H:i" %}</p>
    </footer>
  </body>
</html>
