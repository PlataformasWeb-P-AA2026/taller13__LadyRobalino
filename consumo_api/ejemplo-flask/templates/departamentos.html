<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Departamentos</title>
    <style>
      body { font-family: Arial, sans-serif; background: #f4f7fb; margin: 0; padding: 32px; color: #1b2430; }
      header, .card { background: white; border-radius: 16px; box-shadow: 0 12px 35px rgba(17, 24, 39, 0.08); }
      header { padding: 24px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
      a { color: #0b5cab; text-decoration: none; }
      table { width: 100%; border-collapse: collapse; margin-top: 16px; }
      th, td { padding: 14px; border-bottom: 1px solid #e5e7eb; text-align: left; }
      th { background: #0b5cab; color: white; }
      .actions a { margin-right: 12px; }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Departamentos</h1>
        <p>Total: {{ numero }}</p>
      </div>
      <div class="actions">
        <a href="{{ url_for('crear_departamento') }}">Crear departamento</a>
        <a href="{{ url_for('los_edificios') }}">Ver edificios</a>
      </div>
    </header>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Propietario</th>
            <th>Costo</th>
            <th>Cuartos</th>
            <th>Edificio</th>
          </tr>
        </thead>
        <tbody>
          {% for departamento in datos %}
          <tr>
            <td>{{ departamento.nombre_propietario }}</td>
            <td>{{ departamento.costo_departamento }}</td>
            <td>{{ departamento.numero_cuartos }}</td>
            <td>{{ departamento.edificio }}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </body>
</html>
