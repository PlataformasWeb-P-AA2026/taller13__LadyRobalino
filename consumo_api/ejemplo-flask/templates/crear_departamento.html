<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crear departamento</title>
    <style>
      body { font-family: Arial, sans-serif; background: #f4f7fb; margin: 0; padding: 32px; }
      form { max-width: 560px; background: white; padding: 24px; border-radius: 16px; box-shadow: 0 12px 35px rgba(17, 24, 39, 0.08); }
      label { display: block; margin-top: 16px; margin-bottom: 8px; font-weight: 700; }
      input, select { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 10px; box-sizing: border-box; }
      button { margin-top: 20px; padding: 12px 18px; border: 0; border-radius: 10px; background: #0b5cab; color: white; cursor: pointer; }
      a { color: #0b5cab; text-decoration: none; }
    </style>
  </head>
  <body>
    <p><a href="{{ url_for('los_departamentos') }}">Volver</a></p>
    <form method="post">
      <h1>Crear departamento</h1>
      <label>Propietario</label>
      <input type="text" name="nombre_propietario" required>
      <label>Costo</label>
      <input type="number" step="0.01" name="costo_departamento" required>
      <label>Número de cuartos</label>
      <input type="number" name="numero_cuartos" min="1" required>
      <label>Edificio</label>
      <select name="edificio" required>
        {% for edificio in edificios %}
        <option value="{{ edificio.id }}">{{ edificio.nombre }}</option>
        {% endfor %}
      </select>
      <button type="submit">Guardar</button>
    </form>
  </body>
</html>
